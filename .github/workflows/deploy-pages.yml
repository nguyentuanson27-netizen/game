name: Deploy to GitHub Pages

# Static PWA only: no backend and no secrets. The site is public at
# https://nguyentuanson27-netizen.github.io/game/ (served from the /game/ sub-path).
# Requires Settings -> Pages -> Source: "GitHub Actions" (a one-time repository setting).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deployments never overlap, and a running deployment is not cancelled half-way.
concurrency:
  group: pages
  cancel-in-progress: false

# Nothing by default; each job below asks for exactly what it needs.
permissions: {}

jobs:
  build:
    # Production Pages only ever comes from main, also for manual runs on another ref.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pin npm to the G0 version
        run: npm install --global npm@11.19.0

      - name: Check toolchain versions
        run: |
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"

      - run: npm ci

      - name: Static checks, unit tests and build
        run: npm run verify

      # Same browser gate as the Verify workflow, so a failing e2e suite blocks publishing.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Browser tests (Chromium + WebKit)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      # `verify` builds for local use (base "/"). Build last, for the project-site sub-path,
      # so dist/ is exactly what gets published.
      - name: Build for GitHub Pages (BASE_PATH=/game/)
        env:
          BASE_PATH: /game/
        run: npm run build

      # Written after the build, so it is not in the service worker precache. It lets the
      # post-deploy check prove which commit the live site was built from.
      - name: Record the deployed commit
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          printf '{"sha":"%s","runId":"%s","runAttempt":"%s"}\n' \
            "$DEPLOY_SHA" "$DEPLOY_RUN_ID" "$DEPLOY_RUN_ATTEMPT" > dist/deploy-info.json
          cat dist/deploy-info.json

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Runs against the live URL, so a green workflow means the deployed site really works.
  verify-deployed:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
      EXPECTED_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Pin npm to the G0 version
        run: npm install --global npm@11.19.0

      - run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Verify the live site (manifest, service worker, assets, online load, offline reload)
        run: npm run test:deployed

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-deployed-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
